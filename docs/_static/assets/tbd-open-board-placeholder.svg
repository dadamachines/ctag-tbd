<rect x="90" y="80" width="150" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="165.0" y="110.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Audio</text>
