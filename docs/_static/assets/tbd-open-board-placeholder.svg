<rect x="520" y="270" width="150" height="50" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/><text x="595.0" y="300.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Storage</text>
